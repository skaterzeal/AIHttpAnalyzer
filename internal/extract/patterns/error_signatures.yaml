signatures:
  - id: sql_error_mysql
    name: MySQL SQL Error
    severity: high
    patterns:
      - "You have an error in your SQL syntax"
      - "mysql_fetch_array()"
      - "MySQL server version for the right syntax"
      - "supplied argument is not a valid MySQL"
    implication: "SQL injection potansiyel — hata mesajı sözdizimi bilgisi veriyor"

  - id: sql_error_mssql
    name: MSSQL SQL Error
    severity: high
    patterns:
      - "Unclosed quotation mark after the character string"
      - "Incorrect syntax near"
      - "Microsoft OLE DB Provider for SQL Server"
      - "SqlException"
    implication: "MSSQL hata mesajı — SQL injection araştır"

  - id: sql_error_oracle
    name: Oracle SQL Error
    severity: high
    patterns:
      - "ORA-[0-9]{5}"
      - "Oracle error"
      - "PLS-[0-9]{5}"
    implication: "Oracle DB hata kodu — SQL injection araştır"

  - id: sql_error_postgres
    name: PostgreSQL Error
    severity: high
    patterns:
      - "pg_query()"
      - "PostgreSQL query failed"
      - "ERROR:  syntax error at or near"
      - "PSQLException"
    implication: "PostgreSQL hata mesajı"

  - id: path_disclosure
    name: Full Path Disclosure
    severity: medium
    patterns:
      - "/var/www/html/"
      - "/home/[a-z]+/public_html/"
      - "C:\\\\inetpub\\\\wwwroot\\\\"
      - "/usr/local/apache"
      - "/opt/tomcat"
    implication: "Sunucu dosya sistemi yolu ifşa — hedefleme için kullanılabilir"

  - id: debug_mode_active
    name: Debug Mode Active
    severity: high
    patterns:
      - "DEBUG = True"
      - "debug: true"
      - "APP_DEBUG=true"
      - "FLASK_DEBUG=1"
      - "development mode"
    implication: "Uygulama debug modunda — detaylı hata bilgisi ifşa"

  - id: spring_actuator
    name: Spring Boot Actuator Exposed
    severity: high
    patterns:
      - "/actuator/env"
      - "/actuator/dump"
      - "/actuator/trace"
      - "\"activeProfiles\":"
      - "\"systemEnvironment\":"
    implication: "Spring Actuator endpoint'leri açık — env değişkenleri, heap dump erişilebilir"

  - id: graphql_introspection
    name: GraphQL Introspection Enabled
    severity: medium
    patterns:
      - "\"__schema\":"
      - "\"__types\":"
      - "\"queryType\":"
    implication: "GraphQL introspection açık — tüm şema keşfedilebilir"

  - id: swagger_exposed
    name: Swagger / OpenAPI Exposed
    severity: medium
    patterns:
      - "\"swagger\": \"2.0\""
      - "\"openapi\": \"3."
      - "swaggerUi.presets"
      - "SwaggerUIBundle("
    implication: "API dokümantasyonu açık — tüm endpoint'ler ve parametreler görünür"

  - id: aws_metadata
    name: AWS Metadata Leak
    severity: critical
    patterns:
      - "169.254.169.254"
      - "ec2metadata"
      - "\"AccessKeyId\":"
      - "\"SecretAccessKey\":"
    implication: "AWS meta-data servisine erişim veya credential ifşası"

  - id: gcp_metadata
    name: GCP Metadata Leak
    severity: critical
    patterns:
      - "metadata.google.internal"
      - "computeMetadata/v1"
    implication: "GCP meta-data servisi yanıtı — SSRF ile token/credential alınabilir"

  - id: azure_metadata
    name: Azure Metadata Leak
    severity: critical
    patterns:
      - "/metadata/instance"
      - "\"compute\":\\s*\\{"
    implication: "Azure IMDS yanıtı — SSRF ile yönetilen kimlik token'ı alınabilir"

  - id: lfi_passwd
    name: Local File Inclusion (/etc/passwd)
    severity: critical
    patterns:
      - "root:.*:0:0:"
      - "daemon:.*:/usr/sbin/nologin"
    implication: "Yanıt /etc/passwd içeriği taşıyor — LFI/path traversal doğrulandı"

  - id: dotenv_exposure
    name: Environment File Exposure
    severity: critical
    patterns:
      - "APP_KEY=base64:"
      - "DB_PASSWORD="
      - "AWS_SECRET_ACCESS_KEY="
      - "DATABASE_URL="
    implication: ".env benzeri yapılandırma ifşası — credential/secret sızıntısı"

  - id: git_exposure
    name: Exposed .git Repository
    severity: high
    patterns:
      - "\\[core\\][\\s\\S]{0,40}repositoryformatversion"
      - "ref: refs/heads/"
    implication: ".git dizini erişilebilir — kaynak kod ve geçmiş çekilebilir"

  - id: werkzeug_debugger
    name: Werkzeug Debugger Exposed
    severity: critical
    patterns:
      - "Werkzeug Debugger"
      - "werkzeug.debug"
      - "The console is locked"
    implication: "Flask/Werkzeug interaktif debugger açık — PIN kırılırsa RCE"

  - id: rails_error
    name: Rails Application Error
    severity: high
    patterns:
      - "ActionController::"
      - "ActiveRecord::"
      - "rails/info/properties"
    implication: "Ruby on Rails hata/iç bilgi ifşası"

  - id: sqlite_error
    name: SQLite Error
    severity: high
    patterns:
      - "SQLite3::"
      - "sqlite3.OperationalError"
      - "SQLITE_ERROR"
    implication: "SQLite hata mesajı — SQL injection araştır"

  - id: directory_listing
    name: Directory Listing Enabled
    severity: medium
    patterns:
      - "<title>Index of /"
      - "Directory listing for /"
    implication: "Dizin listeleme açık — dosya/dizin yapısı keşfedilebilir"

  - id: jwt_none_alg
    name: JWT 'none' Algorithm
    severity: high
    patterns:
      - "\"alg\":\\s*\"none\""
      - "\"alg\":\\s*\"None\""
    implication: "JWT 'none' algoritması — imza doğrulaması atlatılabilir"

  - id: iis_detailed_error
    name: ASP.NET Detailed Error
    severity: medium
    patterns:
      - "Server Error in '/' Application"
      - "Runtime Error</h2>"
    implication: "ASP.NET ayrıntılı hata sayfası — iç bilgi ifşası"
