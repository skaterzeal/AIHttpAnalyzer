[project]
name = "http-response-analyzer"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
    "asyncio",
    "pyyaml>=6.0",
    "aiosqlite>=0.20.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "openai>=1.30.0",
    "ollama>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "mitmproxy>=10.3.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "tldextract>=5.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
